# Render blueprint: database + FastAPI backend + Flutter web app.
#
# Deploy with: Render dashboard -> New -> Blueprint -> pick this repo.
# Render reads this file and creates all three services together.
#
# The two service URLs reference each other (CORS one way, API base URL the
# other), so the names below must match the hostnames Render derives from them:
#   agrichain-api -> https://agrichain-api.onrender.com
#   agrichain-web -> https://agrichain-web.onrender.com
# If you rename a service, update both cross-references.

databases:
  - name: agrichain-db
    databaseName: agrichain
    user: agrichain
    plan: free

services:
  # --- FastAPI backend --------------------------------------------------------
  - type: web
    name: agrichain-api
    runtime: python
    plan: free
    rootDir: agrichain-backend
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    # Render injects $PORT and expects the process to bind 0.0.0.0.
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      # Pinned so a future default change on Render cannot break the build.
      - key: PYTHON_VERSION
        value: 3.12.8
      # Wired straight from the managed database; config.py rewrites the scheme
      # to postgresql+asyncpg:// and strips libpq-only query parameters.
      - key: DATABASE_URL
        fromDatabase:
          name: agrichain-db
          property: connectionString
      # Render generates this once and keeps it. Never commit a real key.
      - key: SECRET_KEY
        generateValue: true
      # Must stay false: DEBUG gates the ledger tamper-demo endpoints.
      - key: DEBUG
        value: false
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: 1440
      # Any origin. Deliberate, and safe for how this API authenticates:
      #
      # The alternative is naming the web app's origin, but onrender.com
      # subdomains get a random suffix when a name is taken (agrichain-web-ntyc),
      # and resolving that suffix from a static site via fromService did not
      # work — the browser then blocks every call with no useful error, because
      # a CORS rejection is indistinguishable from a network failure in JS.
      #
      # "*" costs little here: the API is bearer-token authenticated, not
      # cookie-based, so main.py disables allow_credentials whenever the origin
      # is a wildcard. Another site can call the public endpoints, but cannot act
      # as a user without a token it has no way to obtain.
      #
      # Narrow this to the exact origin for a real production deployment.
      # Mobile builds are unaffected either way: native apps send no Origin
      # header, so CORS never applies to them.
      - key: BACKEND_CORS_ORIGINS
        value: "*"

  # --- Flutter web app --------------------------------------------------------
  - type: web
    name: agrichain-web
    runtime: static
    envVars:
      # The API's real hostname, suffix and all, injected by Render at build
      # time. Hardcoding it breaks the moment a service name collides and Render
      # appends a suffix.
      - key: API_HOST
        fromService:
          name: agrichain-api
          type: web
          property: host
    # Flutter is not preinstalled on Render, so the SDK is fetched at build time.
    # --depth 1 keeps the clone small; the build takes a few minutes.
    #
    # Mobile release builds do NOT read this file: they fall back to
    # AppConfig.hostedApiHost, so that constant must be updated separately (or
    # passed as --dart-define=API_HOST=...) for an APK to reach the API.
    buildCommand: >-
      git clone --depth 1 -b stable https://github.com/flutter/flutter.git
      "$HOME/flutter" &&
      export PATH="$HOME/flutter/bin:$PATH" &&
      flutter --version &&
      flutter build web --release
      --dart-define=API_BASE_URL=https://$API_HOST/api/v1
    staticPublishPath: build/web
    routes:
      # Flutter web is a single-page app: every path must serve index.html or a
      # refresh on a deep link returns 404.
      - type: rewrite
        source: /*
        destination: /index.html
